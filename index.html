const P=[{"name": "Fuggerei", "city": "Augsburg", "lat": 48.3692, "lon": 10.8997, "drive": 0.05, "train": 0.08, "cat": "history", "desc": "The world’s oldest social-housing complex still in use, founded by Jakob Fugger in 1521. Walk its lanes and small museums to understand the Fugger family and the settlement’s unusual rules.", "time": "1–1.5 hr", "costband": "€", "cost": "Paid admission", "why": "Great first stop for understanding Augsburg’s identity.", "pair": "Fuggerei • Rathausplatz • old town canals", "level": "Good"}, {"name": "Augsburg UNESCO Water Management System", "city": "Augsburg", "lat": 48.365, "lon": 10.902, "drive": 0.05, "train": 0.08, "cat": "history", "desc": "A network of canals, water towers, fountains and historic hydraulic engineering recognized by UNESCO. The best experience is a walking route through the Lech canals and key waterworks.", "time": "1.5–3 hr", "costband": "Free", "cost": "Free outdoors", "why": "Unique engineering history woven directly into the city.", "pair": "Fuggerei • Maximilianstraße", "level": "Good"}, {"name": "Augsburger Puppenkiste", "city": "Augsburg", "lat": 48.3604, "lon": 10.9037, "drive": 0.05, "train": 0.1, "cat": "fun", "desc": "Germany’s famous marionette theatre and its 'Die Kiste' museum, displaying characters, sets and the craft behind decades of productions.", "time": "1–2 hr", "costband": "€", "cost": "Museum/show varies", "why": "Quirky, distinctly Augsburg and especially good if you grew up with German children’s television.", "pair": "Old town • Basilica St. Ulrich", "level": "Good"}, {"name": "Augsburg Cathedral", "city": "Augsburg", "lat": 48.3745, "lon": 10.8972, "drive": 0.05, "train": 0.08, "cat": "history", "desc": "A Romanesque-Gothic cathedral known for medieval stained glass and layers of architecture spanning many centuries.", "time": "30–60 min", "costband": "Free", "cost": "Usually free", "why": "Easy, beautiful historic stop in the northern old town.", "pair": "Leopold Mozart Haus • Fuggerei", "level": "Good"}, {"name": "Friedberg Castle", "city": "Friedberg", "lat": 48.3556, "lon": 10.9794, "drive": 0.2, "train": 0.3, "cat": "castle", "desc": "A restored Renaissance castle housing Friedberg’s city museum, including the town’s important clockmaking heritage.", "time": "1–2 hr", "costband": "€", "cost": "Low-cost museum", "why": "A very easy local outing when you want something interesting without committing a whole day.", "pair": "Friedberg old town", "level": "Good"}, {"name": "Harburg Castle", "city": "Harburg", "lat": 48.7858, "lon": 10.6876, "drive": 0.65, "train": 1.1, "cat": "castle", "desc": "One of southern Germany’s largest and best-preserved medieval castle complexes, with a history documented back to the 12th century.", "time": "1.5–2.5 hr", "costband": "€", "cost": "Paid tours", "why": "Feels more authentically medieval and less theatrical than Bavaria’s royal palaces.", "pair": "Nördlingen • Romantic Road", "level": "Good"}, {"name": "Nördlingen City Wall", "city": "Nördlingen", "lat": 48.8513, "lon": 10.4884, "drive": 0.8, "train": 1.0, "cat": "history", "desc": "A nearly perfectly preserved medieval town built inside the Ries meteorite crater. You can walk the complete defensive wall around the old town.", "time": "2–4 hr", "costband": "Free", "cost": "Wall walk free", "why": "One of the best compact day trips from Augsburg and unusually different from other Bavarian towns.", "pair": "Daniel Tower • Ries Crater Museum", "level": "Good"}, {"name": "LEGOLAND Deutschland", "city": "Günzburg", "lat": 48.4245, "lon": 10.2986, "drive": 0.55, "train": 1.25, "cat": "fun", "desc": "Large LEGO-themed amusement park with rides, Miniland, building areas and family attractions.", "time": "Full day", "costband": "€€€", "cost": "Dynamic ticket pricing", "why": "Best for a dedicated family theme-park day rather than combining with other sightseeing.", "pair": "Günzburg old town", "level": "Good"}, {"name": "Allgäu Skyline Park", "city": "Bad Wörishofen", "lat": 48.043, "lon": 10.593, "drive": 0.55, "train": 1.0, "cat": "fun", "desc": "Large regional amusement park with roller coasters, water rides and family attractions.", "time": "5–8 hr", "costband": "€€", "cost": "Paid admission", "why": "A closer and often less complicated amusement-park day than Europa-Park.", "pair": "Bad Wörishofen", "level": "Good"}, {"name": "Marienplatz & Old Town", "city": "Munich", "lat": 48.1374, "lon": 11.5755, "drive": 0.9, "train": 0.55, "cat": "city", "desc": "Munich’s historic center: Neues Rathaus, Frauenkirche, Viktualienmarkt and pedestrian streets all cluster within an easy walking loop.", "time": "2–4 hr", "costband": "Free", "cost": "Free to explore", "why": "The essential Munich orientation and easiest foundation for any Munich day.", "pair": "Viktualienmarkt • Residenz", "level": "Major"}, {"name": "Deutsches Museum", "city": "Munich", "lat": 48.1303, "lon": 11.5832, "drive": 0.9, "train": 0.65, "cat": "museum", "desc": "One of the world’s major science and technology museums, with huge collections covering aviation, physics, engineering, instruments and more.", "time": "3–6 hr", "costband": "€", "cost": "Paid admission", "why": "You can easily lose an entire day here; particularly strong if you like engineering or technology.", "pair": "Old Town • Isar", "level": "Major"}, {"name": "BMW Museum & BMW Welt", "city": "Munich", "lat": 48.1768, "lon": 11.5591, "drive": 0.9, "train": 0.7, "cat": "museum", "desc": "BMW’s history museum sits beside the futuristic, free-to-enter BMW Welt delivery and exhibition center.", "time": "2.5–4 hr", "costband": "€", "cost": "BMW Welt free; museum paid", "why": "One of Munich’s best modern attractions even for casual car fans.", "pair": "Olympiapark", "level": "Major"}, {"name": "Munich Residenz", "city": "Munich", "lat": 48.1412, "lon": 11.5785, "drive": 0.9, "train": 0.6, "cat": "castle", "desc": "The enormous former royal palace of Bavaria’s Wittelsbach rulers, packed with ornate state rooms, treasury objects and courtyards.", "time": "2–4 hr", "costband": "€", "cost": "Paid admission", "why": "Much more substantial than it looks from outside; one of Germany’s great palace interiors.", "pair": "Marienplatz • English Garden", "level": "Good"}, {"name": "Nymphenburg Palace", "city": "Munich", "lat": 48.1583, "lon": 11.5033, "drive": 0.85, "train": 0.85, "cat": "castle", "desc": "Baroque summer palace of Bavaria’s rulers surrounded by a huge formal park, canals and smaller garden pavilions.", "time": "2–4 hr", "costband": "€", "cost": "Gardens free; interiors paid", "why": "Excellent when you want palace architecture without leaving Munich.", "pair": "BMW Museum", "level": "Good"}, {"name": "English Garden", "city": "Munich", "lat": 48.1642, "lon": 11.603, "drive": 0.9, "train": 0.65, "cat": "nature", "desc": "One of the world’s largest urban parks, famous for the Eisbach surfers, meadows, beer gardens and long walking routes.", "time": "1.5–4 hr", "costband": "Free", "cost": "Free", "why": "Perfect counterweight to museums and old-town sightseeing.", "pair": "Residenz • Eisbach wave", "level": "Good"}, {"name": "Therme Erding", "city": "Erding", "lat": 48.2905, "lon": 11.886, "drive": 1.25, "train": 1.5, "cat": "fun", "desc": "Enormous thermal-bath, spa and water-slide complex with distinctly different areas for relaxation and high-energy slides.", "time": "4–8 hr", "costband": "€€€", "cost": "Packages vary by area/time", "why": "A destination in itself—best when you want a relaxation or water-park day.", "pair": "Munich", "level": "Major"}, {"name": "Neuschwanstein Castle", "city": "Schwangau", "lat": 47.5576, "lon": 10.7498, "drive": 1.35, "train": 2.0, "cat": "castle", "desc": "King Ludwig II’s fantastical 19th-century castle above the Alpsee, famous for its theatrical interiors and dramatic Alpine setting.", "time": "3–5 hr", "costband": "€", "cost": "€21 adult + booking fee (2026)", "why": "Iconic for a reason; the surrounding viewpoints are as important as the interior tour.", "pair": "Hohenschwangau • Alpsee • Marienbrücke", "level": "Major"}, {"name": "Hohenschwangau Castle", "city": "Schwangau", "lat": 47.5556, "lon": 10.7368, "drive": 1.35, "train": 2.0, "cat": "castle", "desc": "The royal family’s lived-in 19th-century castle below Neuschwanstein, where Ludwig II spent much of his youth.", "time": "1–2 hr", "costband": "€€", "cost": "Paid timed tour", "why": "Often overlooked, but gives much better context for Ludwig II and the royal family.", "pair": "Neuschwanstein • Alpsee", "level": "Major"}, {"name": "Linderhof Palace", "city": "Ettal", "lat": 47.5714, "lon": 10.9608, "drive": 1.45, "train": 2.4, "cat": "castle", "desc": "Ludwig II’s smallest palace—and the only major palace he actually completed—surrounded by elaborate gardens and theatrical follies.", "time": "2–3 hr", "costband": "€", "cost": "Paid admission", "why": "More intimate than Neuschwanstein and arguably better for understanding Ludwig himself.", "pair": "Ettal Abbey • Oberammergau", "level": "Major"}, {"name": "Ettal Abbey", "city": "Ettal", "lat": 47.5696, "lon": 11.095, "drive": 1.45, "train": 2.3, "cat": "history", "desc": "A monumental Benedictine abbey with a spectacular Baroque church set directly beneath the Alps.", "time": "45–90 min", "costband": "Free", "cost": "Church generally free", "why": "Easy high-impact stop on a castle or Garmisch route.", "pair": "Linderhof • Oberammergau", "level": "Major"}, {"name": "Zugspitze", "city": "Garmisch-Partenkirchen", "lat": 47.4211, "lon": 10.9853, "drive": 1.65, "train": 2.1, "cat": "nature", "desc": "Germany’s highest mountain at 2,962 m. Cable car and cogwheel railway access open up sweeping Alpine views and the glacier area without a technical climb.", "time": "4–6 hr", "costband": "€€€", "cost": "€78 adult round trip (summer 2026)", "why": "The big-ticket Alpine experience; save it for a clear-weather day.", "pair": "Eibsee • Garmisch", "level": "Major"}, {"name": "Eibsee", "city": "Grainau", "lat": 47.4571, "lon": 10.9935, "drive": 1.65, "train": 2.15, "cat": "nature", "desc": "Clear turquoise lake directly below the Zugspitze with an easy scenic loop trail and mountain reflections.", "time": "2–4 hr", "costband": "€", "cost": "Lake free; parking/transport extra", "why": "One of the prettiest low-effort landscapes within day-trip range.", "pair": "Zugspitze", "level": "Major"}, {"name": "Partnach Gorge", "city": "Garmisch-Partenkirchen", "lat": 47.4698, "lon": 11.1185, "drive": 1.65, "train": 2.0, "cat": "nature", "desc": "A narrow gorge where a walking path and tunnels run beside roaring water, waterfalls and steep rock walls.", "time": "2–3 hr", "costband": "€", "cost": "€10 adult", "why": "Exceptional scenery for relatively little hiking; conditions can cause temporary closures.", "pair": "Garmisch • Olympic ski stadium", "level": "Major"}, {"name": "Garmisch-Classic / Alpspitze", "city": "Garmisch-Partenkirchen", "lat": 47.439, "lon": 11.05, "drive": 1.65, "train": 2.0, "cat": "nature", "desc": "Cable cars provide access to Alpspitze viewpoints, hiking terrain and the AlpspiX viewing platform.", "time": "3–6 hr", "costband": "€€", "cost": "€39 adult round trip (summer 2026)", "why": "A cheaper, more hiking-oriented Alpine alternative to the Zugspitze summit.", "pair": "Partnach Gorge • Eibsee", "level": "Major"}, {"name": "Ulm Minster", "city": "Ulm", "lat": 48.3985, "lon": 9.9916, "drive": 0.9, "train": 0.75, "cat": "history", "desc": "Gothic church famous for the world’s tallest church steeple; the surrounding old center leads quickly into the Fishermen’s Quarter.", "time": "1–2 hr", "costband": "€", "cost": "Church free; tower fee", "why": "A very strong architecture stop less than an hour from Augsburg.", "pair": "Fishermen’s Quarter", "level": "Good"}, {"name": "Mercedes-Benz Museum", "city": "Stuttgart", "lat": 48.7882, "lon": 9.2339, "drive": 1.8, "train": 1.4, "cat": "museum", "desc": "A spiraling museum tracing the automobile from its invention through Mercedes-Benz engineering, racing and design history.", "time": "2.5–4 hr", "costband": "€", "cost": "~€16 adult", "why": "One of the best automotive museums anywhere, even if you are not a dedicated Mercedes fan.", "pair": "Porsche Museum • Stuttgart center", "level": "Major"}, {"name": "Porsche Museum", "city": "Stuttgart", "lat": 48.8353, "lon": 9.1511, "drive": 1.8, "train": 1.45, "cat": "museum", "desc": "Compact, highly polished museum focused on Porsche road cars, motorsport and engineering.", "time": "1.5–3 hr", "costband": "€", "cost": "€15 adult (2026)", "why": "Pairs perfectly with Mercedes for an automotive-focused day.", "pair": "Mercedes-Benz Museum", "level": "Major"}, {"name": "Lindau Island", "city": "Lindau", "lat": 47.546, "lon": 9.684, "drive": 1.75, "train": 1.5, "cat": "city", "desc": "Historic island old town on Lake Constance, centered on its harbor entrance, lighthouse, cafés and waterfront streets.", "time": "2–4 hr", "costband": "Free", "cost": "Free to explore", "why": "A relaxed, scenic day that feels distinctly different from inland Bavaria.", "pair": "Bodensee boat trip", "level": "Major"}, {"name": "Mainau Island", "city": "Konstanz", "lat": 47.705, "lon": 9.195, "drive": 2.35, "train": 3.2, "cat": "nature", "desc": "Famous garden island in Lake Constance with elaborate seasonal flower displays, parkland and a Baroque palace.", "time": "3–5 hr", "costband": "€€", "cost": "Paid island admission", "why": "Best in spring through early autumn; excellent for gardens and photography.", "pair": "Konstanz • Lake Constance", "level": "Major"}, {"name": "Rhine Falls", "city": "Neuhausen am Rheinfall", "lat": 47.6779, "lon": 8.6156, "drive": 3.5, "train": 4.7, "cat": "nature", "desc": "Europe’s most powerful waterfall by water volume, with close viewing platforms and optional boat rides into the spray.", "time": "2–3 hr", "costband": "€", "cost": "Viewing/boat options vary", "why": "A dramatic natural landmark that pairs well with Schaffhausen.", "pair": "Schaffhausen • Zürich", "level": "Major"}, {"name": "Imperial Castle of Nuremberg", "city": "Nuremberg", "lat": 49.4577, "lon": 11.0751, "drive": 1.7, "train": 1.35, "cat": "castle", "desc": "Fortress complex above Nuremberg’s old town that served emperors of the Holy Roman Empire.", "time": "1.5–2.5 hr", "costband": "€", "cost": "Paid museum areas", "why": "The anchor attraction for a Nuremberg history day.", "pair": "Old Town • Albrecht Dürer House", "level": "Major"}, {"name": "Nuremberg Documentation Center", "city": "Nuremberg", "lat": 49.4315, "lon": 11.1127, "drive": 1.7, "train": 1.5, "cat": "history", "desc": "Museum at the former Nazi Party Rally Grounds examining the rise, propaganda and consequences of National Socialism.", "time": "2–3 hr", "costband": "€", "cost": "Paid admission", "why": "One of the most important modern-history stops in the region.", "pair": "Rally Grounds • Old Town", "level": "Major"}, {"name": "Rothenburg Old Town & Walls", "city": "Rothenburg ob der Tauber", "lat": 49.378, "lon": 10.18, "drive": 1.85, "train": 2.4, "cat": "history", "desc": "Exceptionally preserved walled medieval town with towers, half-timbered streets and a complete walkable defensive circuit.", "time": "3–6 hr", "costband": "Free", "cost": "Town/walls mostly free", "why": "Go early or stay late—the atmosphere improves dramatically outside peak tour-bus hours.", "pair": "Plönlein • Night Watchman Tour", "level": "Major"}, {"name": "Bamberg Old Town", "city": "Bamberg", "lat": 49.8917, "lon": 10.8868, "drive": 2.25, "train": 2.4, "cat": "history", "desc": "UNESCO-listed city spread across river islands and hills, known for the cathedral, Altes Rathaus, Little Venice and breweries.", "time": "4–7 hr", "costband": "Free", "cost": "City exploration free", "why": "One of Bavaria’s richest city days and a great food/beer destination.", "pair": "Cathedral • Rauchbier breweries", "level": "Major"}, {"name": "Würzburg Residence", "city": "Würzburg", "lat": 49.7928, "lon": 9.939, "drive": 2.45, "train": 2.6, "cat": "castle", "desc": "UNESCO Baroque palace famous for its monumental staircase and Tiepolo fresco, with formal court gardens outside.", "time": "2–3 hr", "costband": "€", "cost": "Paid admission", "why": "One of Germany’s most impressive palace interiors.", "pair": "Old Main Bridge • Marienberg Fortress", "level": "Major"}, {"name": "Regensburg Old Town", "city": "Regensburg", "lat": 49.019, "lon": 12.097, "drive": 1.75, "train": 2.0, "cat": "history", "desc": "UNESCO medieval center on the Danube with the Stone Bridge, cathedral, patrician towers and dense historic lanes.", "time": "4–6 hr", "costband": "Free", "cost": "City exploration free", "why": "A full city day that works especially well by train.", "pair": "Walhalla", "level": "Major"}, {"name": "Walhalla", "city": "Donaustauf", "lat": 49.0316, "lon": 12.2241, "drive": 1.9, "train": 2.35, "cat": "history", "desc": "Monumental Greek-temple-style hall above the Danube honoring notable figures from German-speaking history.", "time": "1–2 hr", "costband": "€", "cost": "Low-cost admission", "why": "The panoramic Danube setting is at least as memorable as the hall itself.", "pair": "Regensburg", "level": "Major"}, {"name": "Herrenchiemsee Palace", "city": "Herreninsel", "lat": 47.8606, "lon": 12.3978, "drive": 2.05, "train": 2.3, "cat": "castle", "desc": "Ludwig II’s unfinished homage to Versailles, built on an island in Chiemsee with a vast Hall of Mirrors and formal fountains.", "time": "3–5 hr", "costband": "€€", "cost": "Boat from Prien €11.50 return + palace admission", "why": "The boat ride, island walk and palace make this feel like a complete excursion rather than a single attraction.", "pair": "Fraueninsel • Chiemsee", "level": "Major"}, {"name": "Hohensalzburg Fortress", "city": "Salzburg", "lat": 47.7952, "lon": 13.0477, "drive": 2.35, "train": 2.4, "cat": "castle", "desc": "Huge hilltop fortress dominating Salzburg let customPin=null;dropBtn.onclick=function(){state.drop=!state.drop;this.classList.toggle("on",state.drop);map.getContainer().style.cursor=state.drop?"crosshair":""};map.on("click",e=>{if(!state.drop)return;if(customPin)map.removeLayer(customPin);customPin=L.marker(e.latlng).addTo(map);let n=P.map(p=>({p,d:map.distance(e.latlng,[p.lat,p.lon])})).sort((a,b)=>a.d-b.d).slice(0,5);customPin.bindPopup("<b>Your pin</b><br>"+n.map(x=>x.p.name+" — "+(x.d/1000).toFixed(1)+" km").join("<br>")).openPopup();state.drop=false;dropBtn.classList.remove("on");map.getContainer().style.cursor=""});
